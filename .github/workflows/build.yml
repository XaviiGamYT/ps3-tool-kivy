name: Build Kivy APK (Docker)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Build APK using Buildozer Docker
      run: |
        docker run --rm \
        -v $PWD:/home/user/app \
        kivy/buildozer buildozer android debug
