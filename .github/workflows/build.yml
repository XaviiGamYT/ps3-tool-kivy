name: Build Kivy APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk build-essential libffi-dev libssl-dev
        pip install --upgrade pip
        pip install cython buildozer kivy

    - name: Build APK
      run: |
        buildozer android debug
